name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.5"
      - run: uv venv --python 3.12
      - run: uv pip install -e ".[dev]"
      - name: lint
        run: |
          .venv/bin/ruff check .
          .venv/bin/ruff format --check .
      - name: typecheck
        run: .venv/bin/mypy packages apps
      - name: tests
        run: .venv/bin/pytest --cov-fail-under=80
