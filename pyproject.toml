[project]
name = "lyren"
version = "0.1.0"
description = "Lyren — personal AI platform on Oracle Cloud Infrastructure"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.34,<1.0",
    "pydantic>=2.9,<3.0",
    "pydantic-settings>=2.6,<3.0",
    "oci>=2.140,<3.0",
    "httpx>=0.28,<1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9.0",
    "pytest-cov>=6.0,<8.0",
    "ruff>=0.8,<1.0",
    "mypy>=1.13,<2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "packages/core/lyren_core",
    "packages/inference/lyren_inference",
    "packages/evaluation/lyren_eval",
    "apps/api/lyren_api",
]

[tool.uv]
package = true

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["packages/core", "packages/inference", "packages/evaluation", "apps/api", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "ANN", "S", "TID"]
ignore = ["ANN401"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Header", "fastapi.Query"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "ANN"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "packages/core:packages/inference:packages/evaluation:apps/api"
disallow_any_explicit = false
[[tool.mypy.overrides]]
module = ["oci.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=lyren_core --cov=lyren_inference --cov=lyren_eval --cov=lyren_api --cov-report=term-missing"
pythonpath = ["packages/core", "packages/inference", "packages/evaluation", "apps/api"]
